version: 1
rules:
  - tool: create_refund
    max_amount: 1500000          # in paisa — amounts above this need approval
    action_above_max: require_approval
  - tool: capture_payment
    max_amount: 5000000
    action_above_max: deny
  - tool: "*"                    # fallback/default rule
    action: allow

structuring:
  - tool: create_refund
    group_by: payment_id
    window_hours: 24
    threshold: 1500000
  - tool: create_payout
    group_by: account_number
    window_hours: 168
    threshold: 5000000
